<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" role="img" aria-labelledby="title desc">
  <title id="title">KIROHA</title>
  <desc id="desc">KIROHA, una biblioteca de manga y anime, con paneles de lectura y reproducción estilizados.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#090E20"/>
      <stop offset=".52" stop-color="#171C3A"/>
      <stop offset="1" stop-color="#281B42"/>
    </linearGradient>
    <radialGradient id="glow1">
      <stop offset="0" stop-color="#C57BFA" stop-opacity=".36"/>
      <stop offset="1" stop-color="#C57BFA" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2">
